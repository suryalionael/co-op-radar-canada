# Seed list of employers with a public Greenhouse, Lever or Ashby job board.
#
# Every entry below was checked with scripts/check_board_tokens.py on its `verified` date:
# the board responded and listed at least one job with a Canadian location.
# hq_province is null for employers headquartered outside Canada. hq_country is null
# where the headquarters was not checked.
#
# Entries verified on 2026-10-30 have a source field saying which outside list they
# came from: reference-list (the curated internship list, ADR 0007), coop-watcher
# (the Lever slugs in HamzaPM58/coop-watcher), or both. Entries without it came from
# our own candidate lists. Every check, kept or dropped, with its reason, is in
# data/coverage/token_check_log.csv.
# aliases are for news matching in v2; fill them in as needed.

