# Student-program pages for program watch (brief section 5.2).
#
# Priority: employers the posting pipeline cannot reach (Workday, government).
#
# EVERY URL BELOW IS UNVERIFIED. They were drafted without network access and
# some will be wrong or redirect. Program watch skips any entry whose `verified`
# is empty, so nothing is fetched until you open the page, confirm it is the
# student-program page, and set `verified` to that date.
#
# Optional fields:
#   expected_open / expected_open_src   a stated opening date and the page that states it
#   note / note_date                    a manual entry for the change history

programs:
  - id: fswep
    employer_id: government_of_canada
    name: "Federal Student Work Experience Program (FSWEP)"
