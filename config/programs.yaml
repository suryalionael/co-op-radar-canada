# Student-program pages for program watch (brief section 5.2).
#
# Priority: employers the posting pipeline cannot reach (Workday, government).
#
# Every entry was opened and checked by hand on its `verified` date: it is the
# employer's own page about student, co-op, intern or new-grad hiring, the URL
# is the final one after redirects, robots.txt allows it, and the pipeline's
# own fetcher (pipeline.program_watch.fetch_program) gets a stable main text
# from it. Program watch skips any entry whose `verified` is empty.
#
# Optional fields:
#   expected_open / expected_open_src   a stated opening date and the page that states it
#   note / note_date                    a manual entry for the change history

programs:
