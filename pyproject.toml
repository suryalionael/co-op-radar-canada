[project]
name = "co-op-radar-canada"
version = "0.1.0"
description = "Free tracker for Canadian co-op and internship postings"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyarrow>=16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["coverage_spike", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
